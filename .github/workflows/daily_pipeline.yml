name: 일일 스크리닝 파이프라인

on:
  schedule:
    # 17:00 KST = 08:00 UTC, 월~금
    - cron: "0 8 * * 1-5"
  workflow_dispatch:
    inputs:
      date_override:
        description: "실행 기준일 (YYYY-MM-DD). 비워두면 오늘 날짜."
        required: false
      skip_upload:
        description: "R2 업로드 건너뜀 (true/false)"
        required: false
        default: "false"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: 의존성 설치
        run: pip install -r requirements-pipeline.txt

      - name: 파이프라인 실행
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          DATE_ARG="${{ github.event.inputs.date_override }}"
          UPLOAD_FLAG=""
          if [ "${{ github.event.inputs.skip_upload }}" = "true" ]; then
            UPLOAD_FLAG="--no-upload"
          fi
          if [ -n "$DATE_ARG" ]; then
            python -m src.pipeline.runner --date "$DATE_ARG" $UPLOAD_FLAG
          else
            python -m src.pipeline.runner $UPLOAD_FLAG
          fi

      - name: 파이프라인 로그 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_id }}
          path: logs/
          retention-days: 30
