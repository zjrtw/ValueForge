name: 일일 스크리닝 파이프라인

on:
  workflow_dispatch:
    inputs:
      date_override:
        description: "실행 기준일 (YYYY-MM-DD). 비워두면 KST 기준 전날."
        required: false
      skip_upload:
        description: "R2 업로드 건너뜀 (true/false)"
        required: false
        default: "false"
      markets:
        description: "실행 시장 범위 (KOSPI, KOSDAQ, KOSPI,KOSDAQ)"
        required: false
        default: "KOSPI"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: 의존성 설치
        run: pip install -r requirements-pipeline.txt

      - name: 거래일 확인
        id: check_trading_day
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: |
          RUN_DATE=$(python -c "import os; from datetime import UTC, datetime, timedelta; d=os.environ.get('DATE_OVERRIDE', '').strip(); print(d or ((datetime.now(tz=UTC) + timedelta(hours=9)).date() - timedelta(days=1)).isoformat())")
          export RUN_DATE
          printf 'run_date=%s\n' "$RUN_DATE" >> "$GITHUB_OUTPUT"
          IS_TRADING_DAY=$(python -c "import os; from datetime import date; from src.utils.market_calendar import is_trading_day; d=os.environ['RUN_DATE']; print('true' if is_trading_day(date.fromisoformat(d)) else 'false')" | tail -n 1)
          IS_TRADING_DAY="$(printf '%s' "$IS_TRADING_DAY" | tr -d '\r\n')"
          printf 'is_trading_day=%s\n' "$IS_TRADING_DAY" >> "$GITHUB_OUTPUT"
          if [ "$IS_TRADING_DAY" = "false" ]; then
            echo "🔔 오늘은 KRX 휴장일입니다. 파이프라인을 건너뜁니다."
            exit 0
          fi
          echo "✅ 거래일입니다. 파이프라인을 실행합니다."

      - name: 파이프라인 실행
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          MARKETS: ${{ github.event.inputs.markets || 'KOSPI' }}
        run: |
          DATE_ARG="${{ steps.check_trading_day.outputs.run_date }}"
          UPLOAD_FLAG=""
          if [ "${{ github.event.inputs.skip_upload }}" = "true" ]; then
            UPLOAD_FLAG="--no-upload"
          fi
          python -m src.pipeline.runner --date "$DATE_ARG" $UPLOAD_FLAG

      - name: 파이프라인 로그 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_id }}
          path: logs/
          retention-days: 30
